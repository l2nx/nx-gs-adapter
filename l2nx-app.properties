# L2NX app settings of one game server
# Read by the L2NX adapter from the game server's working directory, next to l2nx.properties (when
# -Dl2nx.config-file points elsewhere, next to that file).
#
# What a character does in the game on a command from the app while its player is away from the
# client. l2nx.properties connects the server to the platform; this file is the server's product
# behaviour, edited by its game designer.
#
# Defaults: a missing key takes its default, a missing file means every default. Every session type
# and the chat with the app are off by default. JVM system properties do not override these keys.
# Every key below is set to its default.
#
# Reload: the adapter checks the file about every 5 seconds and applies a change without a restart;
# the log shows "app settings updated: <key>: <old> -> <new>". The whole file is validated first:
# one invalid value or unknown key (a typo included) applies nothing, the previous values stay and
# the log has one "app settings not applied, previous values stay: <key>: <reason>" line per problem.
# Values are trimmed; true / false and enum names are exact (case matters).
#
# Running sessions: new values govern new starts. A session keeps the return threshold it started
# with; a disabled session type lets running sessions finish and refuses new starts.


# Placed character

# Display-only title over a character the app placed in the world, instead of its own title. Not
# stored: the character's own title comes back by itself. 1-16 characters; empty: no override.
# Default: l2nx.app
app.phantom.title.text=l2nx.app

# Colour of that title, 6 hex digits RGB (FFFF00 yellow, FFFFFF white, 00FF00 green). Used only when
# the title text is set.
# Default: FFFF00
app.phantom.title.color=FFFF00


# Rules of every session type

# No app start within this many minutes after the character left the game with a client.
# 0 turns the rule off. Allowed: 0-60.
# Default: 2
app.session.recent-logout-minutes=2

# No app start when a scheduled restart is closer than this many minutes. Allowed: 0-120.
# Default: 15
app.session.restart-window-minutes=15

# A session that ends with less time in the world than this many minutes returns the character to
# where it started; at or above it the character stays where it is. One threshold for every session
# type, fixed per session at its start. Allowed: 0 or more.
# Default: 30
app.session.return-threshold-minutes=30


# Private store from the app

# The app private store on this server. false: a start is refused as disabled.
# Default: false
app.private-store.enabled=false

# No new private store start (sell or buy) of a character within this many minutes after the real
# start of that character's previous private store from the app; keeps prices from being dumped by
# restarting the store. Other characters of the same player are not held back; closing a store is
# never limited. 0 turns the rule off. Allowed: 0-1440.
# Default: 5
app.private-store.start-cooldown-minutes=5


# Fishing from the app

# Offline fishing on this server. false: a start is refused as disabled. true requires
# app.fishing.spot-pool.
# Default: false
app.fishing.enabled=false

# No new fishing start for any character of a master account within this many minutes after the
# real start of that master account's previous app fishing session. Allowed: 0-1440.
# Default: 15
app.fishing.start-cooldown-minutes=15

# Shortest fishing a start may ask for, in minutes. Allowed: 1 or more.
# Default: 30
app.fishing.min-duration-minutes=30

# Longest fishing a start may ask for, in minutes; not below app.fishing.min-duration-minutes.
# The server's own daily limit may still end a session earlier.
# Default: 1440
app.fishing.max-duration-minutes=1440

# Distance from the fisher to the float along the spot's heading, in game units. Allowed: 90-250.
# Default: 170
app.fishing.float-distance=170

# How a free spot of the pool is picked: RANDOM - any free spot; FIRST_FREE - the free spot with
# the lowest id.
# Default: RANDOM
app.fishing.spot-order=RANDOM

# Name of the spot pool fishing uses on this server; the pool itself (spot ids, coordinates,
# heading) is the game server's data. Allowed: 1-32 characters of a-z, 0-9 and _; empty: no pool.
# A changed pool governs new starts only: a restored session keeps its own.
# Default: empty
app.fishing.spot-pool=


# Revive from the app

# Getting a dead character up at a restart point from the app, with the client still connected or
# already closed. false: a revive is refused as disabled.
# Default: true
app.revive.enabled=true

# Where a revive "to town" puts the character: NATIVE - as the game itself does for "to village";
# SPOT_POOL - a spot of the pools in app.revive.town.spot-pool, one that no running app session
# holds, or any of them when none is free. A character with karma always takes the NATIVE location.
# Default: NATIVE
app.revive.town.mode=NATIVE

# Spot pools a SPOT_POOL revive picks from, comma-separated names (1-32 characters of a-z, 0-9 and
# _ each, no repeats); may name the pool of app.fishing.spot-pool. The pools themselves are the game
# server's data. SPOT_POOL with an empty list is invalid.
# Default: empty
app.revive.town.spot-pool=


# Chat with the app

# Game chat in the app and sending to it from the app. false: game chat is not published to the
# platform, every send from a character in the app is refused as disabled (announcements still go
# out), and a whisper to a name with * to a character out of game is answered as to an unknown name.
# Default: false
app.chat.enabled=false

# Channels the app may send to while the character is in game: CLAN, ALLIANCE, PARTY, WHISPER,
# comma-separated, no repeats. Empty: the app only reads chat in this state.
# Default: CLAN,ALLIANCE,PARTY,WHISPER
app.chat.online-send-channels=CLAN,ALLIANCE,PARTY,WHISPER

# Channels the app may send to while the character is out of game, as above; PARTY is invalid here
# (there is no party out of game). Empty: the app only reads chat in this state.
# Default: CLAN,ALLIANCE,WHISPER
app.chat.offline-send-channels=CLAN,ALLIANCE,WHISPER


# Technical

# After a restart, characters of open sessions return to the world in batches.

# Sessions restored per batch. The adapter caps it at its share of the IO pool (half of
# l2nx.io.workers). Allowed: 1 or more.
# Default: 10
app.restore.batch-size=10

# Pause between restore batches, in milliseconds. Allowed: 0 or more.
# Default: 1000
app.restore.batch-pause-millis=1000

# Closed sessions older than this many days are deleted from the adapter's table at server start.
# The platform keeps its own session history. Allowed: 7 or more.
# Default: 90
app.history.retention-days=90
